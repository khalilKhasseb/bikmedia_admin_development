name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, init ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        env:
          VITE_BASE_API_URL: ${{ secrets.VITE_BASE_API_URL || 'bikmedia.com/dashboard/' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || 'q25etr-as568-er9855-85rtg-45g56' }}
          VITE_AUTH_TOKEN: ${{ secrets.VITE_AUTH_TOKEN || 'dZaMZ423sb0Nv6TtlbwoD2oKR7' }}
          VITE_APP_ENV: production
          VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY || 'bikmedia-dev-key-2025' }}
        run: npm run build:pages
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  